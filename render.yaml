services:
  - type: web
    name: opencode-zen-bridge
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: ZEN_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: API_KEY
        value: "" # Optional: Add your custom secret key here if you want to protect your endpoint
